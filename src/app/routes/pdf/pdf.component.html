<mat-toolbar>
  <span>{{ pdfName === '' ? 'PDF View' : pdfName }}</span>

  <span class="h-spacer"></span>

  <input type="file" #fileInput
    class="invisible"
    [multiple]="false"
    [accept]="ACCEPT_EXTENSIONS"
    (change)="onFileSelected($event)" />

  <button mat-icon-button color="accent"
    aria-label="Upload file"
    (click)="fileInput.click()">
    <mat-icon>upload</mat-icon>
  </button>

  <button *ngIf="pdfUrl"
    mat-icon-button color="primary"
    (click)="onClear()"
    aria-label="Clear PDF">
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>

<sp-filler *ngIf="!pdfUrl" select="pdf"></sp-filler>

<div class="parse-area pdf" *ngIf="pdfUrl" [ngClass]="columns">
  <object type="application/pdf" class="pdf" [data]="pdfUrl"></object>

  <div class="parse-info">
    <ng-container *ngIf="pdfSigned">
      <img class="sign-ok" src="assets/images/pushti-digital-sign.svg">

      <sp-show-pdf-sign [value]="pdfSignature"></sp-show-pdf-sign>
    </ng-container>

    <div class="sign-na" *ngIf="!pdfSigned">
      <img src="assets/images/pushti-no-digital-sign.svg">
    </div>
  </div>
</div>
